<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>非遗记忆翻翻乐</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23D8382B'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='%23FFF6E6'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23D8382B'/%3E%3C/svg%3E">
<style>
/* ============================================================
   1. 设计变量：米黄纸底 + 剪纸红 + 靛蓝 / 姜黄 / 草绿
      —— 配色取自民间年画与窗花，避免高饱和刺眼
   ============================================================ */
:root{
  --paper:#FFF6E6;          /* 纸底 */
  --paper-2:#FFFDF6;        /* 卡面白 */
  --red:#D8382B;            /* 剪纸红 */
  --red-dark:#AE2419;
  --indigo:#2A5B8C;
  --gold:#F4B93E;
  --green:#5FA05A;
  --ink:#3B3029;

  --gap:clamp(8px, 1.3vw, 16px);
  --ratio:1.22;             /* 卡牌高 / 宽 */
  --cols:4;                 /* 桌面端 4 列 3 行 */
  --rows:3;
  --radius:16px;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  padding:18px 16px 28px;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC",sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 10% 6%, rgba(244,185,62,.20), transparent 34%),
    radial-gradient(circle at 92% 96%, rgba(42,91,140,.13), transparent 38%);
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}

/* 隐藏的 SVG 图形库：窗花团花 / 对勾，供 <use> 复用 */
.svg-defs{position:absolute;width:0;height:0;overflow:hidden;}

/* ============================================================
   2. 标题区
   ============================================================ */
.top{text-align:center;max-width:920px;margin:0 auto;}
.title-row{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(8px,2vw,20px);flex-wrap:nowrap;
}
.title-row .rosette{
  width:clamp(24px,4.4vw,46px);height:clamp(24px,4.4vw,46px);
  flex:0 0 auto;opacity:.95;color:var(--red);
}
.title-row .rosette--indigo{transform:rotate(22.5deg);color:var(--indigo);}
h1{
  margin:0;
  font-size:clamp(30px,5.4vw,54px);
  font-weight:900;
  letter-spacing:.07em;
  color:var(--red);
  text-shadow:0 2px 0 #FFE4C4, 0 5px 0 rgba(216,56,43,.14);
  white-space:nowrap;
}
.subtitle{
  margin:8px 0 0;
  font-size:clamp(15px,1.9vw,19px);
  font-weight:600;
  color:rgba(59,48,41,.72);
  letter-spacing:.02em;
}
/* 齿纹分隔条：像剪纸的锯齿边 */
.tooth{
  height:9px;max-width:520px;margin:14px auto 0;
  background:repeating-linear-gradient(90deg,var(--red) 0 9px,transparent 9px 18px);
  border-radius:2px;
  -webkit-mask-image:linear-gradient(#000,#000);
}

/* ============================================================
   3. 状态栏：配对进度 / 翻牌次数 / 重新开始
   ============================================================ */
.status{
  display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:10px 12px;
  margin:16px auto 14px;max-width:920px;
}
.chip{
  display:inline-flex;align-items:baseline;gap:6px;
  background:var(--paper-2);
  border:2px solid rgba(59,48,41,.14);
  border-radius:999px;
  padding:7px 16px;
  font-size:clamp(14px,1.7vw,16px);
  font-weight:600;
  color:rgba(59,48,41,.75);
  box-shadow:0 3px 0 rgba(59,48,41,.07);
}
.chip b{font-size:clamp(20px,2.6vw,25px);font-weight:900;color:var(--red);line-height:1;}
.btn{
  font-family:inherit;font-size:clamp(15px,1.8vw,17px);font-weight:800;
  border:0;border-radius:999px;cursor:pointer;
  padding:9px 22px;min-height:44px;
  background:var(--red);color:#FFFDF6;
  box-shadow:0 5px 0 var(--red-dark);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-dark);}
.btn--ghost{
  background:var(--paper-2);color:var(--red);
  box-shadow:0 5px 0 rgba(216,56,43,.22);
  border:2px solid var(--red);
}
.btn--ghost:active{box-shadow:0 2px 0 rgba(216,56,43,.22);}
.btn:focus-visible,.card:focus-visible,.close-btn:focus-visible{
  outline:3px solid var(--indigo);outline-offset:3px;
}

/* ============================================================
   4. 牌桌：卡的尺寸同时受屏幕宽、高约束，保证一屏放得下
   ============================================================ */
.board{
  --w-limit:calc((min(100vw, 940px) - 36px - (var(--cols) - 1) * var(--gap)) / var(--cols));
  --h-limit:calc((100vh - 285px - (var(--rows) - 1) * var(--gap)) / var(--rows) / var(--ratio));
  --card-w:max(84px, min(178px, var(--w-limit), var(--h-limit)));
  width:calc(var(--cols) * var(--card-w) + (var(--cols) - 1) * var(--gap));
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(var(--cols), var(--card-w));
  grid-auto-rows:calc(var(--card-w) * var(--ratio));
  gap:var(--gap);
}

.card{
  position:relative;padding:0;border:0;background:transparent;
  cursor:pointer;border-radius:var(--radius);
  perspective:1000px;
  touch-action:manipulation;
  transition:transform .16s ease;
}
.card:active{transform:scale(.96);}

.card-inner{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.35,.05,.25,1);
}
/* 翻开：整张卡绕 Y 轴转 180° */
.card.flipped .card-inner{transform:rotateY(180deg);}

.face{
  position:absolute;inset:0;border-radius:var(--radius);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}

/* 4.1 卡背：红纸 + 窗花团花 */
.face--back{
  background:var(--red);
  box-shadow:
    inset 0 0 0 4px #FFF6E6,
    inset 0 0 0 6px var(--red),
    0 5px 0 rgba(174,36,25,.35);
}
.face--back .hua{width:66%;height:66%;opacity:.95;color:#FFF6E6;}

/* 4.2 卡面：白卡 + 插画 + 名字 */
.face--front{
  transform:rotateY(180deg);
  background:var(--paper-2);
  border:4px solid #FFF3DC;
  box-shadow:0 5px 0 rgba(174,36,25,.14);
  flex-direction:column;
}
.face--front .pic{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;display:block;background:#FFF3DC;
}
.face--front .name{
  position:absolute;left:6px;right:6px;bottom:6px;
  padding:3px 2px;
  background:rgba(255,253,246,.94);
  border-radius:999px;
  font-size:clamp(13px,1.75vw,17px);
  font-weight:900;letter-spacing:.04em;
  text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* 配对成功的卡：金边 + 对勾徽章 */
.card.matched{cursor:default;}
.card.matched .face--front{box-shadow:0 0 0 3px var(--gold), 0 6px 0 rgba(174,36,25,.2);}
.card.matched .badge{opacity:1;transform:scale(1);}
.badge{
  position:absolute;top:-8px;right:-8px;
  width:28px;height:28px;border-radius:50%;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(59,48,41,.18);
  opacity:0;transform:scale(.5);
  transition:opacity .25s ease, transform .25s cubic-bezier(.2,1.6,.4,1);
  z-index:2;
}
.badge svg{width:15px;height:15px;fill:var(--paper-2);}

/* 翻错时的轻微抖动 */
.card.wrong{animation:shake .42s ease;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-6px) rotate(-1.5deg);}
  50%{transform:translateX(5px) rotate(1.5deg);}
  75%{transform:translateX(-3px);}
}

/* ============================================================
   5. 非遗小知识弹出卡（固定在底部，不遮挡牌桌）
   ============================================================ */
.tip{
  position:fixed;left:0;right:0;bottom:16px;z-index:40;
  display:flex;justify-content:center;
  pointer-events:none;
  padding:0 12px;
}
.tip-card{
  pointer-events:auto;
  position:relative;
  width:min(600px, 100%);
  background:var(--paper-2);
  border:3px solid var(--red);
  border-radius:20px;
  box-shadow:0 12px 0 rgba(174,36,25,.13);
  padding:16px 18px 14px;
  display:flex;gap:14px;align-items:flex-start;
  opacity:0;transform:translateY(26px) scale(.97);
  transition:opacity .3s ease, transform .32s cubic-bezier(.2,1.2,.4,1);
}
.tip.show .tip-card{opacity:1;transform:translateY(0) scale(1);}
.tip-tag{
  position:absolute;top:-14px;left:16px;
  background:var(--gold);color:var(--ink);
  font-size:13px;font-weight:900;letter-spacing:.06em;
  padding:3px 12px;border-radius:999px;
  box-shadow:0 3px 0 rgba(59,48,41,.16);
}
.tip-thumb{
  flex:0 0 auto;width:clamp(54px,8vw,72px);height:clamp(54px,8vw,72px);
  border-radius:12px;overflow:hidden;background:#FFF3DC;
  border:2px solid #FFE7C2;
}
.tip-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.tip-body{min-width:0;flex:1 1 auto;}
.tip-name{font-size:clamp(19px,2.4vw,24px);font-weight:900;color:var(--red);line-height:1.2;}
.tip-text{margin:4px 0 0;font-size:clamp(14px,1.7vw,16.5px);line-height:1.55;color:rgba(59,48,41,.88);}
.tip-ask{margin:6px 0 0;font-size:clamp(13px,1.55vw,15px);line-height:1.45;color:var(--indigo);font-weight:600;}
.close-btn{
  position:absolute;top:8px;right:10px;
  border:0;background:transparent;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;color:rgba(59,48,41,.55);
  padding:6px 8px;border-radius:10px;min-height:32px;
}
.close-btn:hover{color:var(--red);}

/* ============================================================
   6. 胜利提示框
   ============================================================ */
.win{
  position:fixed;inset:0;z-index:60;
  display:none;place-items:center;
  background:rgba(59,48,41,.5);
  padding:20px;
}
.win.show{display:grid;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.win-card{
  position:relative;
  width:min(640px, 100%);max-height:calc(100vh - 40px);overflow:auto;
  background:var(--paper);
  border:4px solid var(--gold);
  border-radius:26px;
  box-shadow:0 14px 0 rgba(59,48,41,.25);
  padding:26px 22px 20px;
  text-align:center;
  animation:pop .45s cubic-bezier(.2,1.5,.4,1);
}
@keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}

.win-card h2{
  margin:0;font-size:clamp(26px,4vw,38px);font-weight:900;letter-spacing:.05em;color:var(--red);
  text-shadow:0 2px 0 #FFE4C4;
}
.win-sub{margin:8px 0 0;font-size:clamp(15px,1.9vw,18px);font-weight:600;color:rgba(59,48,41,.75);}
.win-sub b{color:var(--indigo);font-weight:900;}
.recap{
  margin:18px 0 0;
  display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;
}
.recap-item{
  background:var(--paper-2);border-radius:14px;padding:8px 6px 9px;
  border:2px solid rgba(59,48,41,.10);
}
.recap-item img{
  width:100%;aspect-ratio:1/1;object-fit:cover;display:block;
  border-radius:10px;background:#FFF3DC;
}
.recap-item .rn{display:block;margin-top:6px;font-size:clamp(13px,1.6vw,15px);font-weight:900;}
.recap-item .rs{display:block;margin-top:2px;font-size:clamp(11px,1.3vw,12.5px);color:rgba(59,48,41,.68);line-height:1.35;}
.win-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px;}

/* 纸屑：只在胜利时出现 */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:22px;}
.confetti i{
  position:absolute;top:-14px;width:9px;height:13px;border-radius:2px;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(78vh) rotate(520deg);opacity:.15;}
}

/* ============================================================
   7. 响应式：窄屏 3 列 4 行
   ============================================================ */
@media (max-width:680px){
  body{padding:14px 10px 18px;}
  .board{--cols:3;--rows:4;--ratio:1.18;}
  .board{
    --h-limit:calc((100vh - 250px - (var(--rows) - 1) * var(--gap)) / var(--rows) / var(--ratio));
  }
  .title-row .rosette{display:none;}
  h1{font-size:clamp(26px,7.6vw,40px);letter-spacing:.04em;}
  .tooth{max-width:76vw;}
  .recap{grid-template-columns:repeat(2, 1fr);}
  .tip{bottom:10px;}
  .tip-card{padding:15px 14px 12px;gap:11px;}
}

@media (prefers-reduced-motion:reduce){
  .card-inner{transition-duration:.01ms;}
  .card.wrong{animation:none;}
  .confetti{display:none;}
}
</style>
</head>
<body>

<!-- ============================================================
     隐藏图形库（不占版面）
     ============================================================ -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <!-- 窗花团花：8 片花瓣 + 虚线外圈，用于卡背 -->
  <symbol id="hua" viewBox="0 0 100 100">
    <g fill="currentColor">
      <ellipse cx="50" cy="24" rx="6" ry="13"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" transform="rotate(45 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" transform="rotate(90 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" transform="rotate(135 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" transform="rotate(180 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" transform="rotate(225 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" transform="rotate(270 50 50)"/>
      <ellipse cx="50" cy="24" rx="6" ry="13" transform="rotate(315 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="9" fill="currentColor"/>
    <circle cx="50" cy="50" r="3.4" fill="#D8382B"/>
    <circle cx="50" cy="50" r="43" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3.5 4.5"/>
  </symbol>
  <symbol id="tick" viewBox="0 0 24 24">
    <path d="M9.2 17.5 3.6 11.9l1.9-1.9 3.7 3.7L18.5 5l1.9 1.9z"/>
  </symbol>
</svg>

<!-- ============================================================
     视图：标题
     ============================================================ -->
<header class="top">
  <div class="title-row">

      <use href="#hua" xlink:href="#hua"></use>
    </svg>
    <h1>非遗记忆翻翻乐</h1>
    <svg class="rosette rosette--indigo" viewBox="0 0 100 100" aria-hidden="true">
      <use href="#hua" xlink:href="#hua"></use>
    </svg>
  </div>
  <p class="subtitle">点一张，再点一张，把一样的两张找出来</p>
  <div class="tooth" aria-hidden="true"></div>
</header>

<!-- ============================================================
     视图：状态栏
     ============================================================ -->
<div class="status">
  <span class="chip">已配对 <b id="matchedNum">0</b> / 6 组</span>
  <span class="chip">翻牌 <b id="flipNum">0</b> 次</span>
  <button type="button" class="btn" id="restartBtn">重新开始</button>
</div>

var board     = document.getElementById('board');

var tip       = document.getElementById('tip');
var tipImg    = document.getElementById('tipImg');
var tipName   = document.getElementById('tipName');
var tipText   = document.getElementById('tipText');
var tipAsk    = document.getElementById('tipAsk');

var winFlips  = document.getElementById('winFlips');

var deck        = [];      // 每张卡对应的非遗数据
var firstIdx    = -1;      // 第一张翻开的卡
var secondIdx   = -1;      // 第二张翻开的卡
var lock        = false;   // 比对动画期间锁住牌桌
var matched     = 0;       // 已配对组数
var flips       = 0;       // 翻牌次数
var tipTimer    = null;    // 小知识自动收起
var tipQueue    = [];      // 小知识排队，避免前一条被覆盖

/* 洗牌：Fisher-Yates，保证分布随机 */
function shuffleDeck(){
  var list = DATA.concat(DATA);           // 6 组复制成 12 张
  for (var i = list.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = list[i]; list[i] = list[j]; list[j] = t;
  }
  return list;
}

/* 把卡面内容填进 12 个卡片骨架 */
function paintCards(){
  cards.forEach(function(card, i){
    var item = deck[i];
    var pic  = card.querySelector('.pic');
    var nm   = card.querySelector('.name');
    pic.src = item.img;
    pic.alt = item.name + '的插画';
    nm.textContent = item.name;
    nm.style.color = item.color;
    card.setAttribute('data-key', item.key);
    card.setAttribute('aria-label', '第 ' + (i + 1) + ' 张卡牌，还没翻开');
  });
}

/* 新开一局 */
function newGame(){
  deck      = shuffleDeck();
  firstIdx  = -1;
  secondIdx = -1;
  lock      = false;
  matched   = 0;
  flips     = 0;
  matchedEl.textContent = '0';
  flipEl.textContent = '0';
  tipQueue.length = 0;
  hideTip(true);
  winBox.classList.remove('show');

  paintCards();
  cards.forEach(function(card){
    card.classList.remove('flipped', 'matched', 'wrong');
  });
}

/* 点击一张卡 */
function onCardClick(card, idx){
  if (lock) return;                                  // 比对中，暂时不许翻
  if (card.classList.contains('matched')) return;    // 已配对的卡不再响应
  if (card.classList.contains('flipped')) return;    // 同一张不能连点两次

  card.classList.add('flipped');
  flips++;
  flipEl.textContent = flips;
  card.setAttribute('aria-label', '第 ' + (idx + 1) + ' 张卡牌，' + deck[idx].name);

  if (firstIdx === -1) {
    firstIdx = idx;                                  // 记下第一张
    return;
  }

  /* 翻开第二张，开始比对 */
  secondIdx = idx;
  lock = true;

  var a = deck[firstIdx];
  var b = deck[secondIdx];

  if (a.key === b.key) {
    /* —— 配对成功：保持翻开，亮金边 —— */
    setTimeout(function(){
      cards[firstIdx].classList.add('matched');
      cards[secondIdx].classList.add('matched');
      matched++;
      matchedEl.textContent = matched;

      if (matched === DATA.length) {
        showWin();                                   // 六组全配对：弹胜利框
      } else {
        pushTip(a);                                  // 每配对一组，弹一条小知识
      }
      resetTurn();
    }, 420);
  } else {
    /* —— 配对失败：抖一下，自动盖回去 —— */
    cards[firstIdx].classList.add('wrong');
    cards[secondIdx].classList.add('wrong');
    setTimeout(function(){
      cards[firstIdx].classList.remove('flipped', 'wrong');
      cards[secondIdx].classList.remove('flipped', 'wrong');
      resetTurn();
    }, 900);
  }
}

/* 清空本轮的记录，恢复可点击 */
function resetTurn(){
  firstIdx = -1;
  secondIdx = -1;
  lock = false;
}

/* ============================================================
   非遗小知识弹出卡（排队播放，5.5 秒自动收起）
   ============================================================ */
function pushTip(item){
  tipQueue.push(item);
  if (!tip.classList.contains('show')) playNextTip();
}

function playNextTip(){
  if (!tipQueue.length) { hideTip(); return; }
  var item = tipQueue.shift();
  tipImg.src = item.img;
  tipImg.alt = item.name + '的插画';
  tipName.textContent = item.name;
  tipName.style.color = item.color;
  tipText.textContent = item.text;
  tipAsk.textContent = item.ask;

  tip.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(function(){ hideTip(); }, 5500);
}

function hideTip(clearQueue){
  tip.classList.remove('show');
  clearTimeout(tipTimer);
  if (clearQueue) { tipQueue.length = 0; return; }
  /* 收起后如果还有排队的小知识，隔一会儿再播下一条 */
  if (tipQueue.length) {
    setTimeout(playNextTip, 260);
  }
}

/* ============================================================
   胜利提示框
   ============================================================ */
function showWin(){
  hideTip(true);
  winFlips.textContent = flips;

  /* 六项非遗的回顾小卡 */
  recapEl.innerHTML = '';
  DATA.forEach(function(item){
    var box = document.createElement('div');
    box.className = 'recap-item';
    var im = document.createElement('img');
    im.src = item.img;
    im.alt = item.name;
    var n = document.createElement('span');
    n.className = 'rn';
    n.textContent = item.name;
    n.style.color = item.color;
    var s = document.createElement('span');
    s.className = 'rs';
    s.textContent = item.short;
    box.appendChild(im); box.appendChild(n); box.appendChild(s);
    recapEl.appendChild(box);
  });

  winBox.classList.add('show');
  makeConfetti();
  document.getElementById('playAgain').focus();
}

/* 胜利时撒下的纸屑（少量、一次性） */
function makeConfetti(){
  var wrap = document.getElementById('confetti');
  wrap.innerHTML = '';
  var colors = ['#D8382B', '#F4B93E', '#2A5B8C', '#5FA05A', '#B04A78'];
  for (var i = 0; i < 22; i++) {
    var p = document.createElement('i');
    p.style.left = (Math.random() * 96 + 2) + '%';
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    p.style.animationDelay = (Math.random() * 0.9) + 's';
    p.style.width = (6 + Math.random() * 6) + 'px';
    p.style.height = (10 + Math.random() * 8) + 'px';
    wrap.appendChild(p);
  }
}

/* ============================================================
   事件绑定
   ============================================================ */
cards.forEach(function(card){
  card.addEventListener('click', function(){
    onCardClick(card, Number(card.getAttribute('data-i')));
  });
});

document.getElementById('tipClose').addEventListener('click', function(){ hideTip(); });
document.getElementById('restartBtn').addEventListener('click', newGame);
document.getElementById('playAgain').addEventListener('click', newGame);
document.getElementById('winClose').addEventListener('click', function(){
  winBox.classList.remove('show');
});

/* 开局 */
newGame();
</script>
</body>
</html>
